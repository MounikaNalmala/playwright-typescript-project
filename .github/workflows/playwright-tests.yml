name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is intentionally not required for this coding exercise.
      # In a production project, commit the lock file and replace npm install with npm ci.
      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      # Intentionally disabled for this coding exercise.
      # The current tests target a production website, so CI must not execute them.
      # In a real project, configure a dedicated QA/staging BASE_URL and enable this step.
      - name: Run Playwright tests (disabled - production safety)
        if: ${{ false }}
        run: npm test

      # Example for a non-production environment:
      # - name: Run Playwright tests
      #   env:
      #     BASE_URL: ${{ secrets.QA_BASE_URL }}
      #   run: npm test

      - name: Test execution notice
        run: echo "Playwright test execution is intentionally disabled because the current target is a production site."
